# Балансування: Weighted Round Robin. З кожних 5 запитів web1 отримує 3, web2 і web3 по одному.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr time=$upstream_response_time';
    access_log /var/log/nginx/access.log lb;

    upstream cafe_backend {
        # Спільна пам'ять: усі worker-процеси nginx ведуть один загальний лічильник.
        zone cafe_backend 64k;
        # max_fails і fail_timeout це пасивна перевірка здоров'я: після 2 невдалих
        # спроб репліка виключається з розподілу на 10 секунд.
        server web1:8000 weight=3 max_fails=2 fail_timeout=10s;
        server web2:8000 max_fails=2 fail_timeout=10s;
        server web3:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        # Метрики для Prometheus читаються всередині мережі Docker, назовні 404.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://cafe_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Якщо репліка не відповіла, запит непомітно для клієнта йде на наступну.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }
    }
}
