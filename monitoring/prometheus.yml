# Prometheus (лаба 8): збирає метрики кожні 5 секунд.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Три репліки застосунку: /metrics віддає сам FastAPI (services/metrics.py).
  # Ходимо напряму в репліки, nginx цей шлях назовні закриває.
  - job_name: web
    metrics_path: /metrics
    static_configs:
      - targets: ["web1:8000", "web2:8000", "web3:8000"]

  # CPU і RAM кожного контейнера.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
